name: tempo_acores
description: "Previsão meteorológica para os Açores. App da UC de PDM, DAW 2, 2026/27."
publish_to: 'none'
version: 1.0.0+1                # versionName + versionCode (aula 31)

environment:
  sdk: ^3.11.0

dependencies:                   # vai para dentro da app
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  intl: ^0.20.3

dev_dependencies:               # só em desenvolvimento e testes
  flutter_test:
    sdk: flutter
